# RTC Lab: Browser -> Traefik -> official engines. Single entry point: http://localhost
name: rtc-lab

x-java-engine-env: &java-engine-env
  SPRING_PROFILES_ACTIVE: offline
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:-UseBASE64Intrinsics -XX:MaxRAMPercentage=60}
  # No telemetry export from a local lab.
  OTEL_SDK_DISABLED: "true"
  OTEL_TRACES_EXPORTER: none
  MANAGEMENT_TRACING_EXPORT_ENABLED: "false"

services:
  traefik:
    image: traefik:v3.6
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Only Traefik sees the Docker socket, read-only. No other service mounts it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [rtc-net]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.entrypoints: dashboard
      traefik.http.routers.dashboard.rule: PathPrefix(`/`)
      traefik.http.routers.dashboard.service: api@internal
    restart: unless-stopped

  # One-shot: builds the SQLite database from the official Flyway scripts (idempotent).
  db-init:
    build:
      context: ./services/regime-regular
      dockerfile: ../../infrastructure/db-init/Dockerfile
      additional_contexts:
        scripts: ./infrastructure/db-init
    volumes:
      # Host folder inside the repository so the SQLite file can be inspected locally.
      - ./data/db:/data
    networks: [rtc-net]
    restart: "no"

  regular:
    build:
      context: ./services/regime-regular
      dockerfile: ../../infrastructure/regular/Dockerfile
    environment: *java-engine-env
    volumes:
      - ./data/db:/app/calculadora/db:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [rtc-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9101/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      traefik.enable: "true"
      traefik.docker.network: rtc-net
      # Public /api/regular/* -> engine /api/* (engine context path is /api)
      traefik.http.middlewares.regular-strip.stripprefix.prefixes: /api/regular
      traefik.http.middlewares.regular-add.addprefix.prefix: /api
      traefik.http.middlewares.regular-limit.buffering.maxRequestBodyBytes: "1048576"
      traefik.http.routers.regular.entrypoints: web
      traefik.http.routers.regular.rule: PathPrefix(`/api/regular`)
      traefik.http.routers.regular.middlewares: regular-limit,regular-strip,regular-add
      traefik.http.routers.regular.service: regular
      traefik.http.services.regular.loadbalancer.server.port: "8080"
      # Real actuator health, exposed on its own path. Metrics are NOT exposed.
      traefik.http.middlewares.regular-health.replacepath.path: /health
      traefik.http.routers.regular-health.entrypoints: web
      traefik.http.routers.regular-health.rule: Path(`/health/regular`)
      traefik.http.routers.regular-health.middlewares: regular-health
      traefik.http.routers.regular-health.service: regular-mgmt
      traefik.http.services.regular-mgmt.loadbalancer.server.port: "9101"
    restart: unless-stopped

  simples:
    build:
      context: ./services/simples-nacional
      dockerfile: ../../infrastructure/simples/Dockerfile
    environment:
      <<: *java-engine-env
      VERSAO_AMBIENTE: offline
    volumes:
      - ./data/db:/app/calculadora/db:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [rtc-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9103/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      traefik.enable: "true"
      traefik.docker.network: rtc-net
      traefik.http.middlewares.simples-strip.stripprefix.prefixes: /api/simples
      traefik.http.middlewares.simples-add.addprefix.prefix: /api
      traefik.http.middlewares.simples-limit.buffering.maxRequestBodyBytes: "1048576"
      traefik.http.routers.simples.entrypoints: web
      traefik.http.routers.simples.rule: PathPrefix(`/api/simples`)
      traefik.http.routers.simples.middlewares: simples-limit,simples-strip,simples-add
      traefik.http.routers.simples.service: simples
      traefik.http.services.simples.loadbalancer.server.port: "8082"
      traefik.http.middlewares.simples-health.replacepath.path: /health
      traefik.http.routers.simples-health.entrypoints: web
      traefik.http.routers.simples-health.rule: Path(`/health/simples`)
      traefik.http.routers.simples-health.middlewares: simples-health
      traefik.http.routers.simples-health.service: simples-mgmt
      traefik.http.services.simples-mgmt.loadbalancer.server.port: "9103"
    restart: unless-stopped

  danfse:
    build:
      context: ./services/danfse
      dockerfile: ../../infrastructure/danfse/Dockerfile
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      XML_MAX_SIZE_BYTES: ${XML_MAX_SIZE_BYTES:-5242880}
      OTEL_SDK_DISABLED: "true"
    networks: [rtc-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    labels:
      traefik.enable: "true"
      traefik.docker.network: rtc-net
      traefik.http.middlewares.danfse-limit.buffering.maxRequestBodyBytes: "6291456"
      traefik.http.middlewares.danfse-strip.stripprefix.prefixes: /api/danfse
      # Public POST /api/danfse maps 1:1 to the engine's POST /api/danfse.
      traefik.http.routers.danfse.entrypoints: web
      traefik.http.routers.danfse.rule: Path(`/api/danfse`)
      traefik.http.routers.danfse.middlewares: danfse-limit
      traefik.http.routers.danfse.service: danfse
      # Anything below /api/danfse/ (health, swagger) has the prefix stripped.
      traefik.http.routers.danfse-rest.entrypoints: web
      traefik.http.routers.danfse-rest.rule: PathPrefix(`/api/danfse/`)
      traefik.http.routers.danfse-rest.middlewares: danfse-strip
      traefik.http.routers.danfse-rest.service: danfse
      traefik.http.services.danfse.loadbalancer.server.port: "8080"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    networks: [rtc-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: rtc-net
      # Catch-all with the lowest priority: engine routes always win.
      traefik.http.routers.web.entrypoints: web
      traefik.http.routers.web.rule: PathPrefix(`/`)
      traefik.http.routers.web.priority: "1"
      traefik.http.routers.web.service: web
      traefik.http.services.web.loadbalancer.server.port: "80"
    restart: unless-stopped

networks:
  rtc-net:
    name: rtc-net

