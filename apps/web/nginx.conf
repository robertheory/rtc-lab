server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static single-page app. Routing is hash-based, so unknown paths are real 404s.
  location / {
    try_files $uri $uri/ =404;
  }

  # Scenario catalog and engine pins must never be served stale.
  location ~ ^/(scenarios/|engines\.lock\.json) {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
}
